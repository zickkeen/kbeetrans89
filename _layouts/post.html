---
layout: default
---

<article class="py-12">
  <div class="container">
    <div class="max-w-4xl mx-auto">
      <header class="mb-8">
        <h1 class="text-4xl font-bold text-[#1A2B48] mb-4">{{ page.title }}</h1>
        <div class="flex items-center text-gray-600 text-sm mb-4">
          <i class="fas fa-calendar mr-2"></i>
          <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%d %B %Y" }}</time>
          {% if page.author %}
          <span class="mx-4">•</span>
          <i class="fas fa-user mr-2"></i>
          {{ page.author }}
          {% endif %}
        </div>
        {% if page.tags %}
        <div class="flex flex-wrap gap-2">
          {% for tag in page.tags %}
          <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm">{{ tag }}</span>
          {% endfor %}
        </div>
        {% endif %}
      </header>

      <div class="prose prose-lg max-w-none">
        {{ content }}
      </div>

      <footer class="mt-12 pt-8 border-t border-gray-200">
        <div class="flex justify-between items-center">
          <a href="{{ site.url }}{{ site.baseurl }}/blog/" class="text-[#ff5722] hover:text-[#e64a19]">
            ← Kembali ke Blog
          </a>
          <div class="flex space-x-4">
            <a href="https://wa.me/6282146252589?text=Hai, saya tertarik dengan artikel {{ page.title }}" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition duration-300">
              <i class="fab fa-whatsapp mr-2"></i>Hubungi WhatsApp
            </a>
          </div>
        </div>
      </footer>
    </div>
  </div>
</article>
